<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="课堂随机抽取小组发言的在线抽号系统，无放回等概率抽样，结果可复核。">
  <title>在线抽号系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <header class="site-header">
    <div class="brand">
      <h1 class="site-title">在线抽号系统</h1>
      <p class="site-subtitle">课堂随机抽取小组发言，公平高效，结果可复核</p>
    </div>
    <button id="resetBtn" class="btn btn-secondary" type="button">重置</button>
  </header>

  <main class="main">
    <section class="stage" id="stage" aria-busy="false">
      <div id="roller" class="roller" aria-hidden="true">?</div>
      <div id="result" class="result-grid hidden" aria-hidden="true"></div>
      <p id="hint" class="stage-hint">点击“开始抽号”开始抽取</p>
      <!-- 读屏唯一播报出口：滚动过程不播报，抽完只整句播报一次 -->
      <p id="liveResult" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>

    <section class="controls" aria-label="参数设置">
      <div class="field">
        <label for="totalInput">总小组数</label>
        <input id="totalInput" type="number" min="1" max="999" step="1" value="10" inputmode="numeric">
      </div>
      <div class="field">
        <label for="countInput">每次抽取组数</label>
        <input id="countInput" type="number" min="1" max="999" step="1" value="1" inputmode="numeric">
      </div>
      <button id="drawBtn" class="btn btn-primary btn-large" type="button">开始抽号</button>
      <p id="errorMsg" class="error-msg hidden" role="alert"></p>
    </section>

    <section class="status" aria-label="抽取状态">
      <div class="panel">
        <h2 class="panel-title">剩余未抽取</h2>
        <div id="remaining" class="chip-container"></div>
      </div>
      <div class="panel">
        <h2 class="panel-title">已抽取记录</h2>
        <div id="drawn" class="chip-container"></div>
      </div>
    </section>

    <section class="panel log-panel" aria-label="抽号记录与公平性核验">
      <div class="log-head">
        <h2 class="panel-title">抽号记录 · 可核验</h2>
        <div class="log-actions">
          <span id="logMeta" class="log-meta"></span>
          <button id="exportLogBtn" class="btn btn-secondary btn-small" type="button" disabled>导出记录</button>
        </div>
      </div>
      <p class="log-note">
        每次抽号都记录随机种子与抽样前后的号码池，任何人拿种子就能离线重算出同一结果，
        用于核验结果未被篡改。控制台可用 <code>LotteryAudit.verifyAll()</code> 一键复核。
      </p>
      <div id="logList" class="log-list"></div>
    </section>
  </main>

  <!-- 彩带只是装饰：异步加载，失败也不影响抽号主流程 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" async></script>
  <script src="random.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
